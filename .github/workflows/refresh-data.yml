name: Refresh generated data

on:
  push:
    branches: ["main"]
    paths:
      - "data.js"
      - "scripts/build-data.mjs"
      - ".github/workflows/refresh-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate all 151 records
        run: node scripts/build-data.mjs

      - name: Commit generated data
        run: |
          if git diff --quiet -- generated-data.js; then
            echo "Generated data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-data.js
          git commit -m "Refresh Generation I data"
          git push
