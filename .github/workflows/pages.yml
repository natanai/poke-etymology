name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check naming-credits.js
          node --check scripts/validate-language-tags.mjs
          node --check scripts/validate-naming-credits.mjs
          node --check guides/guide.js
          node --check guides/guide-i18n.js
          node --check guides/guide-copy-overrides.js
          node --check guides/guide-touch.js
          node --check guides/index-i18n.js

      - name: Validate language-analysis tags
        run: node scripts/validate-language-tags.mjs

      - name: Validate naming credits
        run: node scripts/validate-naming-credits.mjs

      - name: Build Generation I data
        run: node scripts/build-data.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
