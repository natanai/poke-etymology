name: Validate static data

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: validate-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-agent-draft:
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && startsWith(github.head_ref, 'agent/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Convert agent pull request to draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready --undo "$PR_URL"

  validate:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'opened' || !startsWith(github.head_ref, 'agent/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check region-filter.js
          node --check generation-ii-data.js
          node --check naming-credits.js
          node --check naming-credits-generation-ii.js
          node --check scripts/report-name-effects.mjs
          node --check scripts/validate-language-tags.mjs
          node --check scripts/validate-name-effects.mjs
          node --check scripts/validate-naming-credits.mjs
          node --check scripts/validate-region-filter.mjs
          for file in verified-research*.js; do node --check "$file"; done

      - name: Validate region search and selector
        run: node scripts/validate-region-filter.mjs

      - name: Validate language-analysis tags
        run: node scripts/validate-language-tags.mjs

      - name: Validate name-effect scope
        run: node scripts/validate-name-effects.mjs

      - name: Validate naming credits
        run: node scripts/validate-naming-credits.mjs
