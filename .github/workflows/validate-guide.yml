name: Validate Living Dex guide

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "guides/**"
      - "data.js"
      - "generated-data.js"
      - "generation-ii-data.js"
      - "reference-data.js"
      - ".github/workflows/validate-guide.yml"
  workflow_dispatch:

concurrency:
  group: validate-guide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-guide:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check guide JavaScript syntax
        run: |
          for file in guides/*.js guides/*.mjs; do node --check "$file"; done

      - name: Validate guide structure
        run: node guides/validate-guide.mjs
