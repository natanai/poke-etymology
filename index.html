<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f380f">
<title>Poké Etymology</title>
<style>
:root{--i:#0f380f;--d:#306230;--m:#8bac0f;--p:#9bbc0f}
*{box-sizing:border-box}html{background:var(--i)}body{margin:0;padding:max(12px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));background:repeating-linear-gradient(0deg,#0f380f 0 2px,#102f10 2px 4px);color:var(--i);font:700 15px/1.35 "Courier New",monospace}
button,input{font:inherit}button{border-radius:0;touch-action:manipulation}.shell{max-width:820px;margin:auto;border:4px solid var(--p);outline:4px solid var(--d);background:var(--d);box-shadow:8px 8px #061f06}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;color:var(--p);border-bottom:4px solid var(--i)}header small{display:block;font-size:10px;letter-spacing:1px}h1{font-size:clamp(20px,6vw,32px);line-height:1;margin:4px 0 0}.power{font-size:10px;white-space:nowrap}.power:before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--p);border:2px solid var(--i);vertical-align:-2px}main{min-height:600px;padding:14px;background:repeating-linear-gradient(0deg,transparent 0 2px,#8bac0f55 2px 4px),var(--p);border:4px solid var(--i);box-shadow:inset 0 0 0 4px var(--m)}.bar{display:flex;justify-content:space-between;gap:8px;padding-bottom:7px;margin-bottom:12px;border-bottom:3px double var(--i);font-size:12px}label{display:block;font-size:11px;margin-bottom:5px}.search{display:flex;gap:8px;align-items:center;padding:8px;border:3px solid var(--i);background:var(--m)}input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--i);text-transform:uppercase}.tabs{display:flex;gap:8px;margin:10px 0 14px}.btn{border:3px solid var(--i);padding:7px 10px;background:var(--p);color:var(--i);box-shadow:3px 3px var(--d);cursor:pointer}.btn:hover,.btn:focus-visible,.btn.on{background:var(--i);color:var(--p);outline:2px solid var(--p);outline-offset:-5px}.list{list-style:none;margin:0;padding:0;border-top:3px solid var(--i)}.list button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:11px 7px;border:0;border-bottom:2px solid var(--d);background:transparent;color:var(--i);text-align:left;cursor:pointer}.list button:hover,.list button:focus-visible{background:var(--i);color:var(--p);outline:0}.type{font-size:10px;text-align:right}[hidden]{display:none!important}.id{padding:12px;margin-bottom:16px;border:4px solid var(--i);background:var(--m)}.id h2{font-size:clamp(25px,8vw,43px);line-height:1;margin:3px 0;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.chip{padding:3px 6px;border:2px solid var(--i);background:var(--p);font-size:11px}h3{display:inline-block;margin:0;padding:3px 7px;background:var(--i);color:var(--p);font-size:12px}section{margin-bottom:16px}.box{border:3px solid var(--i)}.names>div{display:grid;grid-template-columns:85px 1fr;gap:8px;padding:8px;border-bottom:2px solid var(--d)}.names>div:last-child{border:0}.ev{display:grid;grid-template-columns:repeat(3,1fr)}.ev>div{min-height:58px;display:grid;place-items:center;align-content:center;border-right:2px solid var(--d);border-bottom:2px solid var(--d);text-align:center}.ev>div:nth-child(3n){border-right:0}.ev>div:nth-last-child(-n+3){border-bottom:0}.ev small{font-size:9px}.ev strong{font-size:20px}.ety>article{padding:10px;border-bottom:3px double var(--d)}.ety>article:last-child{border:0}.ety h4{margin:0 0 6px}.roots{padding:5px;margin:5px 0;background:var(--m);border-left:5px solid var(--i)}.confidence{display:inline-block;padding:2px 5px;border:2px solid var(--i);font-size:10px}.dialog{padding:12px;border:4px double var(--i)}.dialog p{margin:9px 0 0}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}footer{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 20px;padding:10px;color:var(--p);border-top:4px solid var(--i);font-size:10px}@media(min-width:720px){main{padding:20px 30px}.list{columns:2;column-gap:18px;border-top:0}.list li{break-inside:avoid;border-top:2px solid var(--d)}}
</style>
</head>
<body>
<div class="shell">
<header><div><small>POKéDEX RESEARCH SYSTEM</small><h1>POKé ETYMOLOGY</h1></div><div class="power">POWER</div></header>
<main>
<div id="browse">
<div class="bar"><span>GEN I // DATA SEED</span><span id="count">25 SEEN</span></div>
<label for="q">SEARCH ANY LANGUAGE</label>
<div class="search"><span>▶</span><input id="q" type="search" placeholder="NAME / NUMBER" autocomplete="off"></div>
<div class="tabs"><button class="btn on" data-lang="e">EN</button><button class="btn" data-lang="f">FR</button><button class="btn" data-lang="j">JP</button></div>
<ol id="list" class="list"></ol>
<p id="none" hidden>NO DATA FOUND.</p>
</div>
<div id="detail" hidden>
<div class="bar"><button id="back" class="btn">◀ B: BACK</button><span id="pos"></span></div>
<div class="id"><small id="dex"></small><h2 id="name"></h2><div id="sub"></div><div id="chips" class="chips"></div></div>
<section><h3>NAME DATA</h3><div id="names" class="box names"></div></section>
<section><h3>EFFORT VALUE YIELD</h3><div id="ev" class="box ev"></div></section>
<section><h3>WORD ROOTS</h3><div id="ety" class="box ety"></div></section>
<section class="dialog"><h3>LOCALIZATION COMPARE</h3><p id="compare"></p></section>
<nav class="nav"><button id="prev" class="btn">◀ PREV</button><button id="next" class="btn">NEXT ▶</button></nav>
</div>
</main>
<footer><span>▲▼ MOVE</span><span>A SELECT</span><span>B BACK</span></footer>
</div>
<script>
const DATA=[{"d":1,"e":"Bulbasaur","f":"Bulbizarre","j":"フシギダネ","r":"Fushigidane","t":["Grass","Poison"],"v":[0,0,0,1,0,0],"x":[["不思議 (fushigi, strange) + 種 (tane, seed); also 不思議だね (fushigi da ne)","“Mysterious seed,” with a phrase-like pun: “Strange, isn’t it?”","high"],["bulbe + bizarre","“Strange bulb.”","high"],["bulb + -saur","A bulb-bearing reptilian creature.","high"]],"c":"Japanese layers a plant description with a full-sentence pun. French keeps the ‘strange’ idea; English shifts toward a dinosaur-style species name."},{"d":2,"e":"Ivysaur","f":"Herbizarre","j":"フシギソウ","r":"Fushigisou","t":["Grass","Poison"],"v":[0,0,0,1,1,0],"x":[["不思議 (fushigi, strange) + 草 (sō, grass); also 不思議そう (fushigi-sō)","“Mysterious grass,” while also sounding like “it seems strange.”","high"],["herbe + bizarre","“Strange herb/grass.”","high"],["ivy + -saur","An ivy-covered reptilian creature.","high"]],"c":"All three languages preserve the family pattern, but Japanese again carries a grammatical pun that is difficult to reproduce directly."},{"d":3,"e":"Venusaur","f":"Florizarre","j":"フシギバナ","r":"Fushigibana","t":["Grass","Poison"],"v":[0,0,0,2,1,0],"x":[["不思議 (fushigi, strange) + 花 (hana, flower), voiced as bana","“Mysterious flower.”","high"],["flore / fleur + bizarre","A strange flowering creature.","high"],["Venus flytrap / Venus + -saur","A grand plant-reptile associated with Venus or a Venus flytrap.","medium"]],"c":"French most transparently mirrors the biological progression. Japanese keeps both progression and recurring wordplay; English keeps the dinosaur suffix."},{"d":4,"e":"Charmander","f":"Salamèche","j":"ヒトカゲ","r":"Hitokage","t":["Fire"],"v":[0,0,0,0,0,1],"x":[["火 (hi, fire) + トカゲ (tokage, lizard)","“Fire lizard.”","high"],["salamandre + mèche","A salamander with a wick/flame tuft.","high"],["char + salamander","A fire-charred salamander.","high"]],"c":"Japanese states the concept plainly; English and French turn it into compact portmanteaus, with French emphasizing the tail as a wick."},{"d":5,"e":"Charmeleon","f":"Reptincel","j":"リザード","r":"Lizardo","t":["Fire"],"v":[0,0,0,1,0,1],"x":[["English loanword lizard","“Lizard.”","high"],["reptile + étincelle","“Spark reptile.”","high"],["char + chameleon","A fire-charred chameleon.","high"]],"c":"The English and French names remain constructed puns; Japanese deliberately becomes blunt and forceful."},{"d":6,"e":"Charizard","f":"Dracaufeu","j":"リザードン","r":"Lizardon","t":["Fire","Flying"],"v":[0,0,0,3,0,0],"x":[["lizard + -don","A large or imposing lizard.","medium"],["dragon + feu","“Fire dragon.”","high"],["char + lizard","A fire-charred lizard.","high"]],"c":"French foregrounds the dragon fantasy; English and Japanese formally keep it within the lizard naming line."},{"d":7,"e":"Squirtle","f":"Carapuce","j":"ゼニガメ","r":"Zenigame","t":["Water"],"v":[0,0,1,0,0,0],"x":[["銭 (zeni, old coin) + 亀 (kame, turtle)","“Coin turtle.”","high"],["carapace + puce","“Flea-sized shell,” or a tiny shelled creature.","high"],["squirt + turtle","A small turtle that squirts water.","high"]],"c":"English emphasizes the attack, French the tiny body and shell, and Japanese a culturally familiar turtle term with a coin image."},{"d":8,"e":"Wartortle","f":"Carabaffe","j":"カメール","r":"Kameil","t":["Water"],"v":[0,0,1,0,1,0],"x":[["亀 (kame, turtle) + tail / mail, likely","A turtle defined by its elaborate tail or armored shell.","medium"],["carapace + baffe","A shelled creature that can deliver a slap.","medium"],["war + tortoise/turtle","A battle-ready turtle.","high"]],"c":"Each localization chooses a different sign of maturity: battle in English, a slap in French, and likely the tail or armor in Japanese."},{"d":9,"e":"Blastoise","f":"Tortank","j":"カメックス","r":"Kamex","t":["Water"],"v":[0,0,0,0,3,0],"x":[["亀 (kame, turtle) + X","“Turtle X,” suggesting an ultimate or mechanically enhanced turtle.","medium"],["tortue + tank","“Turtle tank.”","high"],["blast + tortoise","A tortoise that fires powerful blasts.","high"]],"c":"All three localizations converge on weaponized armor, using artillery, tank, and mechanical-final-form imagery."},{"d":10,"e":"Caterpie","f":"Chenipan","j":"キャタピー","r":"Caterpie","t":["Bug"],"v":[1,0,0,0,0,0],"x":[["English caterpillar","A shortened, cute rendering of “caterpillar.”","high"],["chenille + chenapan","A caterpillar and a little rascal.","high"],["caterpillar + pie/cutie-like ending","A cute caterpillar.","medium"]],"c":"English/Japanese mostly miniaturize caterpillar; French adds the distinct joke of a mischievous little scamp."},{"d":11,"e":"Metapod","f":"Chrysacier","j":"トランセル","r":"Transel","t":["Bug"],"v":[0,0,2,0,0,0],"x":[["transform + cell, likely","A transforming cell or casing.","medium"],["chrysalide + acier","“Steel chrysalis.”","high"],["metamorphosis + pod","A pod undergoing transformation.","high"]],"c":"All three describe transformation, but French uniquely foregrounds the shell’s hardness."},{"d":12,"e":"Butterfree","f":"Papilusion","j":"バタフリー","r":"Butterfree","t":["Bug","Flying"],"v":[0,0,0,2,1,0],"x":[["English butterfly + free","The same butterfly/free wordplay used in English.","high"],["papillon + illusion","An illusion butterfly.","high"],["butterfly + free","A butterfly set free from its cocoon.","high"]],"c":"English preserves the Japanese name’s liberation image; French replaces it with a more magical illusion motif."},{"d":13,"e":"Weedle","f":"Aspicot","j":"ビードル","r":"Beedle","t":["Bug","Poison"],"v":[0,0,0,0,0,1],"x":[["bee + needle","A bee-like creature with a needle.","high"],["aspic + asticot","A venomous maggot/larva.","high"],["wee + needle / weevil","A tiny needle-bearing larva.","medium"]],"c":"Every version foregrounds the stinger; French adds a particularly vivid venomous-snake association."},{"d":14,"e":"Kakuna","f":"Coconfort","j":"コクーン","r":"Cocoon","t":["Bug","Poison"],"v":[0,0,2,0,0,0],"x":[["English loanword cocoon","“Cocoon.”","high"],["cocon + confort","“Comfortable cocoon.”","high"],["cocoon, respelled","A cocoon.","high"]],"c":"Japanese is literal, English stylizes the same word, and French invents a cozy joke."},{"d":15,"e":"Beedrill","f":"Dardargnan","j":"スピアー","r":"Spear","t":["Bug","Poison"],"v":[0,2,0,0,1,0],"x":[["English spear","“Spear.”","high"],["dard + d’Artagnan, likely","A stinger-bearing duelist.","medium"],["bee + drill","A bee whose stingers act like drills.","high"]],"c":"Japanese names the weapon, English turns it into a powered tool, and French frames the creature as a flamboyant duelist."},{"d":16,"e":"Pidgey","f":"Roucool","j":"ポッポ","r":"Poppo","t":["Normal","Flying"],"v":[0,0,0,0,0,1],"x":[["pigeon cooing sound symbolism","A coo-coo-like bird name.","high"],["roucouler + cool","A cool bird that coos.","high"],["pigeon + diminutive ending","A little pigeon.","high"]],"c":"Japanese and French both center the sound of a pigeon; English mainly creates a cute diminutive."},{"d":17,"e":"Pidgeotto","f":"Roucoups","j":"ピジョン","r":"Pigeon","t":["Normal","Flying"],"v":[0,0,0,0,0,2],"x":[["English loanword pigeon","“Pigeon.”","high"],["roucouler + coups","A cooing bird that delivers blows.","high"],["pigeon + -otto","A larger, more mature Pidgey.","medium"]],"c":"Japanese becomes literal, English enlarges the family name, and French evolves the cooing joke into combat."},{"d":18,"e":"Pidgeot","f":"Roucarnage","j":"ピジョット","r":"Pigeot","t":["Normal","Flying"],"v":[0,0,0,0,0,3],"x":[["pigeon + jet, likely","A jet-fast pigeon.","medium"],["roucouler + carnage","A cooing bird that causes carnage.","high"],["pigeon / Pidgeotto, shortened","The final, streamlined form of the pigeon line.","medium"]],"c":"French has the clearest comic escalation; Japanese likely emphasizes jet speed, while English inherits the Japanese-style family sound."},{"d":19,"e":"Rattata","f":"Rattata","j":"コラッタ","r":"Koratta","t":["Normal"],"v":[0,0,0,0,0,1],"x":[["子 (ko, small/child) + rat, likely","A little rat.","medium"],["same international name as English","The same rat-based rhythmic coinage.","high"],["rat + rat-a-tat","A rat with a rapid, chattering sound.","medium"]],"c":"English/French emphasize rhythm and speed; Japanese likely makes the rat explicitly small."},{"d":20,"e":"Raticate","f":"Rattatac","j":"ラッタ","r":"Ratta","t":["Normal"],"v":[0,0,0,0,0,2],"x":[["rat","A larger, more direct rat name.","high"],["rat + attaque","“Rat attack.”","high"],["rat + eradicate / masticate","A rat that gnaws or destroys.","medium"]],"c":"French is the most transparent battle pun; English layers possible destructive/chewing roots, and Japanese simplifies the family name."},{"d":21,"e":"Spearow","f":"Piafabec","j":"オニスズメ","r":"Onisuzume","t":["Normal","Flying"],"v":[0,0,0,0,0,1],"x":[["鬼 (oni, ogre/demon) + 雀 (suzume, sparrow)","“Demon sparrow.”","high"],["piaf + bec","“Bird/beak,” with piaf as informal French for a small bird.","high"],["spear + sparrow","A sharp, aggressive sparrow.","high"]],"c":"Japanese gives the strongest personality label, English weaponizes the beak, and French uses lively colloquial bird vocabulary."},{"d":22,"e":"Fearow","f":"Rapasdepic","j":"オニドリル","r":"Onidrill","t":["Normal","Flying"],"v":[0,0,0,0,0,2],"x":[["鬼 (oni, demon) + drill","“Demon drill.”","high"],["rapace + as de pique / pic","A bird of prey with a sharp beak; possibly an “ace of spades” pun.","medium"],["fear + sparrow","A fearsome bird.","high"]],"c":"English focuses on fear, Japanese on a drilling weapon, and French blends predator and sharp-beak imagery."},{"d":23,"e":"Ekans","f":"Abo","j":"アーボ","r":"Arbo","t":["Poison"],"v":[0,1,0,0,0,0],"x":[["boa reversed, likely","A reversed boa name.","high"],["boa rearranged/reversed","A reversed or rearranged boa.","high"],["snake spelled backward","“Snake,” reversed.","high"]],"c":"This is unusually coordinated localization: each language independently preserves the backwards-snake joke."},{"d":24,"e":"Arbok","f":"Arbok","j":"アーボック","r":"Arbok","t":["Poison"],"v":[0,2,0,0,0,0],"x":[["cobra reversed","“Cobra,” reversed.","high"],["same reversed cobra construction","A reversed cobra.","high"],["cobra spelled backward, with k","“Cobra,” reversed.","high"]],"c":"Unlike many localized names, Arbok functions almost identically across Japanese, French, and English."},{"d":25,"e":"Pikachu","f":"Pikachu","j":"ピカチュウ","r":"Pikachū","t":["Electric"],"v":[0,0,0,0,0,2],"x":[["ピカピカ (pikapika, sparkling/flashing) + チュウチュウ (chūchū, mouse squeak)","“Sparkle-squeak.”","high"],["retained Japanese name","The Japanese sound-symbolic name is used unchanged.","high"],["retained Japanese name","The Japanese sound-symbolic name is used unchanged.","high"]],"c":"The name is globally unchanged, but only Japanese speakers receive the wordplay immediately without explanation."}];
let lang="e",filtered=DATA,current=null;
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(3,"0");
const norm=s=>String(s).normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
function draw(){
  $("#list").innerHTML=filtered.map(p=>`<li><button data-d="${p.d}"><span>No.${pad(p.d)}</span><strong>${lang==="j"?p.j+" ("+p.r+")":p[lang]}</strong><span class="type">${p.t.join("/")}</span></button></li>`).join("");
  $("#count").textContent=filtered.length+" SEEN";$("#none").hidden=filtered.length>0;
}
function filter(){
  const q=norm($("#q").value);
  filtered=DATA.filter(p=>norm([p.d,pad(p.d),p.e,p.f,p.j,p.r,...p.t].join(" ")).includes(q));draw();
}
function show(d){
  const p=DATA.find(x=>x.d===+d);if(!p)return;current=p;location.hash=pad(p.d);
  $("#dex").textContent=`No.${pad(p.d)} // ${p.t.join(" / ").toUpperCase()}`;
  $("#name").textContent=p.e.toUpperCase();$("#sub").textContent=`${p.f} // ${p.j} — ${p.r}`;$("#pos").textContent=`${p.d} / ${DATA.length}`;
  $("#chips").innerHTML=p.t.map(x=>`<span class="chip">${x.toUpperCase()}</span>`).join("");
  $("#names").innerHTML=[["ENGLISH",p.e],["FRANÇAIS",p.f],["日本語",p.j],["ROMAJI",p.r]].map(x=>`<div><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join("");
  const labs=["HP / PV","ATTACK / ATQ","DEFENSE / DÉF","SP. ATK","SP. DEF","SPEED / VIT"];
  $("#ev").innerHTML=p.v.map((x,i)=>`<div><small>${labs[i]}</small><strong>${x}</strong></div>`).join("");
  const ll=["日本語","FRANÇAIS","ENGLISH"];
  $("#ety").innerHTML=p.x.map((x,i)=>`<article><h4>${ll[i]}</h4><p class="roots">ROOTS: ${x[0]}</p><p>${x[1]}</p><span class="confidence">CONFIDENCE: ${x[2].toUpperCase()}</span></article>`).join("");
  $("#compare").textContent=p.c;$("#prev").disabled=p.d===1;$("#next").disabled=p.d===DATA.length;
  $("#browse").hidden=true;$("#detail").hidden=false;scrollTo(0,0);
}
function closeEntry(){history.replaceState(null,"",location.pathname);$("#detail").hidden=true;$("#browse").hidden=false}
$("#q").addEventListener("input",filter);
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b)show(b.dataset.d)});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("on",x===b));draw()}));
$("#back").addEventListener("click",closeEntry);$("#prev").addEventListener("click",()=>show(current.d-1));$("#next").addEventListener("click",()=>show(current.d+1));
addEventListener("keydown",e=>{if(!$("#detail").hidden&&(e.key==="Escape"||e.key.toLowerCase()==="b"))closeEntry();else if(!$("#detail").hidden&&e.key==="ArrowLeft")show(current.d-1);else if(!$("#detail").hidden&&e.key==="ArrowRight")show(current.d+1)});
draw();const initial=+location.hash.slice(1);if(initial)show(initial);
</script>
</body>
</html>
