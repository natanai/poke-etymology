<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b2926">
  <meta name="description" content="Pokémon names across English, French, and Japanese, with etymology, localization notes, and EV yields.">
  <title>Poké Etymology</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Poké Etymology</h1>
    </div>
  </header>

  <nav class="primary-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="#explore">Names</a>
      <a href="#guides">Living Dex</a>
      <a href="https://github.com/natanai/poke-etymology">Data</a>
    </div>
  </nav>

  <main class="main-inner">
    <div id="browse">
      <section id="explore" class="explorer" aria-labelledby="explore-title">
        <div class="section-heading">
          <h2 id="explore-title">Generation I</h2>
          <span id="count">25 entries</span>
        </div>

        <div class="explorer-controls">
          <label for="q">Search</label>
          <div class="search-wrap">
            <input id="q" type="search" placeholder="Name or #001" autocomplete="off">
          </div>
          <fieldset class="language-picker">
            <legend>Index language</legend>
            <div class="tabs">
              <button type="button" class="btn on" data-lang="e" aria-pressed="true">English</button>
              <button type="button" class="btn" data-lang="f" aria-pressed="false">Français</button>
              <button type="button" class="btn" data-lang="j" aria-pressed="false">日本語</button>
            </div>
          </fieldset>
        </div>

        <ol id="list" class="list"></ol>
        <p id="none" class="empty" hidden>No match.</p>
      </section>

      <section id="guides" class="guide-panel" aria-labelledby="guide-title">
        <div class="section-heading">
          <h2 id="guide-title">Living Dex</h2>
        </div>
        <div class="guide-row">
          <strong>FireRed / LeafGreen</strong>
          <span>In development</span>
        </div>
        <div class="guide-row muted-row">
          <strong>Red / Blue / Yellow</strong>
          <span>Later</span>
        </div>
      </section>
    </div>

    <article id="detail" class="detail-shell" hidden>
      <div class="detail-toolbar">
        <button id="back" type="button" class="btn">← Index</button>
        <span id="pos"></span>
      </div>

      <header class="entry-head">
        <p id="dex" class="eyebrow"></p>
        <h2 id="name"></h2>
        <div id="sub" class="entry-sub"></div>
        <div id="chips" class="chips"></div>
      </header>

      <section class="entry-section comparison">
        <h3>Localization</h3>
        <p id="compare"></p>
      </section>

      <section class="entry-section">
        <h3>Names</h3>
        <div id="names" class="names"></div>
      </section>

      <section class="entry-section">
        <h3>Roots & meaning</h3>
        <div id="ety" class="ety"></div>
      </section>

      <section class="entry-section">
        <h3>EV yield</h3>
        <div id="ev" class="ev"></div>
      </section>

      <nav class="entry-nav" aria-label="Pokémon entries">
        <button id="prev" type="button" class="btn">← Previous</button>
        <button id="next" type="button" class="btn">Next →</button>
      </nav>
    </article>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
