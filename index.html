<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b2926">
  <meta name="description" content="Generation I Pokémon names in English, French, and Japanese, with etymology and EV yields.">
  <title>Poké Etymology</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="research.css">
  <link rel="stylesheet" href="label-fixes.css?v=1">
</head>
<body>
  <header class="site-header"><div class="header-inner"><h1>Poké Etymology</h1></div></header>
  <nav class="primary-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="active" href="./">Names</a>
      <a href="guides/">Living Dex</a>
      <a href="https://github.com/natanai/poke-etymology">Data</a>
    </div>
  </nav>

  <main class="main-inner">
    <section id="explore" class="explorer" aria-labelledby="explore-title">
      <div class="section-heading"><h2 id="explore-title">Generation I</h2><span id="count">151 entries</span></div>
      <div class="explorer-controls">
        <label for="q">Search</label>
        <div class="search-wrap"><input id="q" type="search" placeholder="Name or #001" autocomplete="off"></div>
        <fieldset class="language-picker">
          <legend>Index language</legend>
          <div class="tabs">
            <button type="button" class="btn on" data-lang="e" aria-pressed="true">English</button>
            <button type="button" class="btn" data-lang="f" aria-pressed="false">Français</button>
            <button type="button" class="btn" data-lang="j" aria-pressed="false">日本語</button>
          </div>
        </fieldset>
      </div>
      <ol id="list" class="list"></ol>
      <p id="none" class="empty" hidden>No match.</p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="generated-data.js"></script>
  <script src="associations.js"></script>
  <script src="verified-research.js"></script>
  <script src="verified-research-010-018.js"></script>
  <script src="verified-research-019-027.js"></script>
  <script src="verified-research-028-036.js"></script>
  <script src="verified-research-037-045.js"></script>
  <script src="verified-research-046-054.js"></script>
  <script src="verified-research-055-063.js"></script>
  <script src="verified-research-064-072.js"></script>
  <script src="verified-research-073-081.js"></script>
  <script src="verified-research-082-090.js"></script>
  <script src="verified-research-091-099.js"></script>
  <script src="verified-research-100-108.js"></script>
  <script src="reference-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
