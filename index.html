<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b2926">
  <meta name="description" content="Pokémon names in English, French, and Japanese, with source-reviewed etymology and EV yields.">
  <title>Poké Etymology</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="research.css">
  <link rel="stylesheet" href="label-fixes.css?v=2">
  <link rel="stylesheet" href="region-filter.css">
</head>
<body>
  <header class="site-header"><div class="header-inner"><h1>Poké Etymology</h1></div></header>
  <nav class="primary-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="active" href="./">Names</a>
      <a href="guides/">Living Dex</a>
      <a href="https://github.com/natanai/poke-etymology">Data</a>
    </div>
  </nav>

  <main class="main-inner">
    <section id="explore" class="explorer" aria-labelledby="explore-title">
      <div class="section-heading"><h2 id="explore-title">Generations I–II</h2><span id="count">186 entries</span></div>
      <div class="explorer-controls">
        <label for="q">Search</label>
        <div class="search-wrap">
          <input id="q" type="search" placeholder="Name, #001, region, or type" autocomplete="off">
          <label class="visually-hidden" for="region">Region</label>
          <select id="region" aria-label="Filter by region">
            <option value="">All regions</option>
          </select>
        </div>
        <fieldset class="language-picker">
          <legend>Index language</legend>
          <div class="tabs">
            <button type="button" class="btn on" data-lang="e" aria-pressed="true">English</button>
            <button type="button" class="btn" data-lang="f" aria-pressed="false">Français</button>
            <button type="button" class="btn" data-lang="j" aria-pressed="false">日本語</button>
          </div>
        </fieldset>
      </div>
      <ol id="list" class="list"></ol>
      <p id="none" class="empty" hidden>No match.</p>
    </section>
  </main>

  <script src="data.js"></script>
